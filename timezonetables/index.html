  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0e1117;
      --surface:     #161b22;
      --surface2:    #1e2530;
      --border:      #2d333b;
      --border-soft: rgba(45,51,59,0.6);
      --text:        #cdd9e5;
      --muted:       #768390;
      --bright:      #e6edf3;
      --accent:      #4d9de0;
      --accent-dim:  rgba(77,157,224,0.15);
      --danger:      #e5534b;
      --day-line:    rgba(77,157,224,0.25);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 2rem 2rem 0;
    }

    /* ── Header ─────────────────────────────────── */
    header {
      display: flex;
      align-items: baseline;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--bright);
      letter-spacing: -0.03em;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.82rem;
    }

    /* ── Selectors ───────────────────────────────── */
    .selectors {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      margin-bottom: 1.5rem;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .tz-slot {
      position: relative;
      width: 195px;
      flex-shrink: 0;
      cursor: grab;
    }

    .tz-slot.dragging {
      opacity: 0.4;
    }

    .tz-slot.drag-over .tz-slot-inner {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }

    .tz-slot-inner {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.7rem 0.75rem 0.65rem;
    }

    .tz-slot-label {
      font-size: 0.67rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 0.45rem;
      padding-right: 18px;
      user-select: none;
    }

    .tz-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text);
      font-size: 0.83rem;
      padding: 0.4rem 0.6rem;
      outline: none;
      transition: border-color 0.12s;
      cursor: text;
    }

    .tz-input:focus {
      border-color: var(--accent);
    }

    .tz-input::placeholder {
      color: var(--muted);
    }

    .tz-dropdown {
      position: absolute;
      top: calc(100% + 3px);
      left: 0;
      right: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      max-height: 260px;
      overflow-y: auto;
      z-index: 300;
      display: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .tz-dropdown.open { display: block; }

    .tz-group-label {
      position: sticky;
      top: 0;
      padding: 0.35rem 0.65rem 0.2rem;
      font-size: 0.63rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      background: var(--bg);
      border-bottom: 1px solid var(--border-soft);
    }

    .tz-option {
      padding: 0.38rem 0.65rem;
      cursor: pointer;
      font-size: 0.81rem;
      color: var(--text);
      transition: background 0.08s;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    .tz-option:hover {
      background: var(--surface2);
      color: var(--bright);
    }

    .tz-opt-sub {
      color: var(--muted);
      font-size: 0.72rem;
      flex-shrink: 0;
    }

    .tz-option.no-match {
      color: var(--muted);
      cursor: default;
      font-style: italic;
    }

    .remove-btn {
      position: absolute;
      top: 7px;
      right: 7px;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.8rem;
      line-height: 1;
      padding: 2px 4px;
      border-radius: 3px;
      transition: color 0.1s, background 0.1s;
    }

    .remove-btn:hover {
      color: var(--danger);
      background: rgba(229,83,75,0.1);
    }

    .add-btn {
      background: transparent;
      border: 1px dashed var(--border);
      border-radius: 8px;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.82rem;
      padding: 0.7rem 1.1rem;
      transition: border-color 0.15s, color 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .add-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ── Table ───────────────────────────────────── */
    .table-wrap {
      flex: 1;
      overflow-x: auto;
      overflow-y: auto;
      min-height: 0;
      padding-bottom: 1rem;
    }

    .empty-msg {
      padding: 4rem 2rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.88rem;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      max-width: calc(var(--col-count, 1) * 280px);
      margin: 0 auto;
      font-size: 0.875rem;
    }

    thead th {
      background: var(--surface);
      padding: 0.85rem 1.75rem 0.8rem;
      text-align: center;
      border-bottom: 2px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
      white-space: nowrap;
    }

    .th-city {
      display: block;
      color: var(--bright);
      font-size: 0.9rem;
      font-weight: 600;
    }

    .th-sub {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 400;
    }

    .th-date {
      display: block;
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 400;
      margin-top: 0.18rem;
    }

    .th-abbr {
      display: inline-block;
      color: var(--accent);
      font-size: 0.65rem;
      font-weight: 400;
      margin-top: 0.12rem;
      background: var(--accent-dim);
      padding: 1px 5px;
      border-radius: 3px;
    }

    tbody tr td {
      padding: 0.48rem 1.75rem;
      text-align: center;
      border-bottom: 1px solid var(--border-soft);
      white-space: nowrap;
      vertical-align: middle;
      transition: background 0.05s;
    }

    /* Day-phase coloring (per cell) */
    td.phase-day   { background: rgba(60,130,210,0.07); }
    td.phase-dawn  { background: rgba(160,110,230,0.08); }
    td.phase-dusk  { background: rgba(210,120,60,0.09); }
    /* phase-night: default bg */

    tbody tr:hover td          { background: var(--surface2) !important; }
    tbody tr.is-current td     { background: var(--accent-dim) !important; }
    tbody tr.is-current:hover td { background: var(--accent-dim) !important; }

    .time-str {
      display: block;
      color: var(--text);
    }

    tbody tr.is-current .time-str {
      color: var(--accent);
      font-weight: 600;
    }

    .now-label {
      display: inline-block;
      font-size: 0.62rem;
      color: var(--accent);
      background: var(--accent-dim);
      border: 1px solid var(--day-line);
      border-radius: 3px;
      padding: 1px 5px;
      margin-top: 0.15rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .day-label {
      display: block;
      font-size: 0.65rem;
      color: var(--muted);
      margin-top: 0.12rem;
    }

    td.day-change {
      border-top: 1px solid var(--day-line);
    }
  </style>
</head>

  // ── State ──────────────────────────────────────────────────────────────────
  let slots = [
    { id: 1, cityObj: null },
    { id: 2, cityObj: null },
  ];
  let nextId = 3;

  const MAX_SLOTS = 6;

  // Drag state
  let dragSrcId = null;

  // ── Helpers ────────────────────────────────────────────────────────────────
  function currentHourDate() {
    const now = new Date();
    return new Date(now.getFullYear(), now.getMonth(), now.getDate(), now.getHours(), 0, 0, 0);
  }

  function fmt(date, tz, opts) {
    return new Intl.DateTimeFormat('en-US', { timeZone: tz, ...opts }).format(date);
  }

  function fmtTime(date, tz) {
    return fmt(date, tz, { hour: 'numeric', minute: '2-digit', hour12: true });
  }

  function fmtDate(date, tz) {
    return fmt(date, tz, { weekday: 'short', month: 'short', day: 'numeric' });
  }

  function dayKey(date, tz) {
    return fmt(date, tz, { year: 'numeric', month: '2-digit', day: '2-digit' });
  }

  function tzAbbr(date, tz) {
    const parts = new Intl.DateTimeFormat('en-US', {
      timeZone: tz, timeZoneName: 'short'
    }).formatToParts(date);
    return parts.find(p => p.type === 'timeZoneName')?.value ?? '';
  }

  function getLocalHour(date, tz) {
    const parts = new Intl.DateTimeFormat('en-US', {
      timeZone: tz, hour: 'numeric', hour12: false
    }).formatToParts(date);
    const h = parseInt(parts.find(p => p.type === 'hour')?.value ?? '0', 10);
    return h === 24 ? 0 : h;
  }

  // ── Solar time-of-day calculation ──────────────────────────────────────────
  // Approximates seasonal sunrise/sunset variation for a mid-latitude location.
  // Colors reflect the season but not the specific latitude of each city.
  function getSolarTimes() {
    const now = new Date();
    const dayOfYear = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 86_400_000);
    // Northern hemisphere: longer days in summer (~day 172), shorter in winter
    const amplitude = 1.5; // hours of variation from equinox baseline
    const offset = -amplitude * Math.cos(2 * Math.PI * (dayOfYear - 10) / 365);
    return {
      dawn:    5.5 + offset,
      sunrise: 6.5 + offset,
      sunset:  17.5 + offset,
      dusk:    18.5 + offset,
    };
  }

  function getDayPhase(hour, solar) {
    if (hour < solar.dawn   || hour >= solar.dusk)   return 'night';
    if (hour < solar.sunrise)                         return 'dawn';
    if (hour < solar.sunset)                          return 'day';
    return 'dusk';
  }

  // ── Dropdown HTML ──────────────────────────────────────────────────────────
  function buildDropdownHTML(slotId, query) {
    const q = query.trim().toLowerCase();
    let html = '';
    let lastRegion = null;
    let count = 0;

    CITIES.forEach((c, i) => {
      if (q && !c.city.toLowerCase().includes(q) && !c.sub.toLowerCase().includes(q)) return;
      if (c.region !== lastRegion) {
        html += `<div class="tz-group-label">${c.region}</div>`;
        lastRegion = c.region;
      }
      const subHTML = c.sub ? `<span class="tz-opt-sub">${c.sub}</span>` : '';
      html += `<div class="tz-option" data-action="select-city" data-slot-id="${slotId}" data-idx="${i}">${c.city}${subHTML}</div>`;
      count++;
    });

    if (!count) html = `<div class="tz-option no-match">No cities match</div>`;
    return html;
  }

  // ── Dropdown open/close ────────────────────────────────────────────────────
  function openDropdown(slotId, query) {
    openDropdownId = slotId;
    document.querySelectorAll('.tz-dropdown').forEach(d => {
      if (+d.dataset.slotId === slotId) {
        d.innerHTML = buildDropdownHTML(slotId, query);
        d.classList.add('open');
      } else {
        d.classList.remove('open');
      }
    });
  }

  function closeAllDropdowns() {
    openDropdownId = null;
    document.querySelectorAll('.tz-dropdown').forEach(d => d.classList.remove('open'));
    slots.forEach(s => {
      const inp = document.querySelector(`.tz-input[data-slot-id="${s.id}"]`);
      if (inp) inp.value = s.cityObj ? s.cityObj.city : '';
    });
  }

  // ── Render selectors ───────────────────────────────────────────────────────
  function renderSelectors() {
    const container = document.getElementById('selectors');
    container.innerHTML = '';

    slots.forEach(slot => {
      const wrap = document.createElement('div');
      wrap.className = 'tz-slot';
      wrap.dataset.slotId = slot.id;
      wrap.draggable = true;

      const removable = slots.length > 2;
      const val = slot.cityObj ? slot.cityObj.city : '';

      wrap.innerHTML = `
        <div class="tz-slot-inner">
          ${removable ? `<button class="remove-btn" data-action="remove" data-slot-id="${slot.id}" title="Remove">✕</button>` : ''}
          <div class="tz-slot-label">City / Timezone</div>
          <input class="tz-input" type="text" placeholder="Search city…"
            value="${val}" autocomplete="off" spellcheck="false"
            data-slot-id="${slot.id}">
        </div>
        <div class="tz-dropdown" data-slot-id="${slot.id}"></div>
      `;

      container.appendChild(wrap);

      const input = wrap.querySelector('.tz-input');

      input.addEventListener('focus', () => {
        input.select();
        openDropdown(slot.id, '');
      });

      input.addEventListener('input', () => {
        openDropdown(slot.id, input.value);
      });

      input.addEventListener('blur', () => {
        setTimeout(() => {
          const s = slots.find(x => x.id === slot.id);
          if (s && document.activeElement !== input) {
            input.value = s.cityObj ? s.cityObj.city : '';
            const dd = wrap.querySelector('.tz-dropdown');
            if (dd && openDropdownId === slot.id) {
              dd.classList.remove('open');
              openDropdownId = null;
            }
          }
        }, 180);
      });

      // Drag events — prevent drag if user is interacting with the input
      wrap.addEventListener('dragstart', e => {
        if (e.target === input) { e.preventDefault(); return; }
        dragSrcId = slot.id;
        wrap.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });

      wrap.addEventListener('dragend', () => {
        wrap.classList.remove('dragging');
        container.querySelectorAll('.tz-slot').forEach(s => s.classList.remove('drag-over'));
        dragSrcId = null;
      });

      wrap.addEventListener('dragover', e => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        if (dragSrcId !== null && dragSrcId !== slot.id) {
          container.querySelectorAll('.tz-slot').forEach(s => s.classList.remove('drag-over'));
          wrap.classList.add('drag-over');
        }
      });

      wrap.addEventListener('drop', e => {
        e.preventDefault();
        if (dragSrcId === null || dragSrcId === slot.id) return;
        const fromIdx = slots.findIndex(s => s.id === dragSrcId);
        const toIdx   = slots.findIndex(s => s.id === slot.id);
        if (fromIdx < 0 || toIdx < 0) return;
        const moved = slots.splice(fromIdx, 1)[0];
        slots.splice(toIdx, 0, moved);
        render();
      });
    });

    // Add button
    if (slots.length < MAX_SLOTS) {
      const btn = document.createElement('button');
      btn.className = 'add-btn';
      btn.dataset.action = 'add';
      btn.textContent = '+ Add timezone';
      container.appendChild(btn);
    }
  }

  // ── Render table ───────────────────────────────────────────────────────────
  function renderTable() {
    const wrap = document.getElementById('table-wrap');
    const active = slots.filter(s => s.cityObj);

    if (!active.length) {
      wrap.innerHTML = '<div class="empty-msg">Select a city above to get started.</div>';
      return;
    }

    const now    = new Date();
    const start  = currentHourDate();
    const solar  = getSolarTimes();
    const hours  = Array.from({ length: 25 }, (_, i) =>
      new Date(start.getTime() + i * 3_600_000)
    );

    // Header — show city + sub label
    let thead = '<tr>';
    active.forEach(col => {
      const abbr    = tzAbbr(now, col.cityObj.tz);
      const subPart = col.cityObj.sub ? ` <span class="th-sub">· ${col.cityObj.sub}</span>` : '';
      thead += `
        <th>
          <span class="th-city">${col.cityObj.city}${subPart}</span>
          <span class="th-date">${fmtDate(now, col.cityObj.tz)}</span>
          <span class="th-abbr">${abbr}</span>
        </th>`;
    });
    thead += '</tr>';

    // Track previous day key per column
    const prevDay = active.map(col => dayKey(hours[0], col.cityObj.tz));

    // Body
    let tbody = '';
    hours.forEach((hour, i) => {
      const isCurrent = i === 0;
      // For the "now" row use exact current time; other rows use the hour boundary
      const displayTime = isCurrent ? now : hour;
      tbody += `<tr class="${isCurrent ? 'is-current' : ''}">`;

      active.forEach((col, ci) => {
        const dk = dayKey(hour, col.cityObj.tz);
        const dayChanged = i > 0 && dk !== prevDay[ci];
        if (dayChanged) prevDay[ci] = dk;

        // Phase coloring based on local hour in this timezone
        const localHour = getLocalHour(hour, col.cityObj.tz);
        const phase     = getDayPhase(localHour, solar);

        const timeStr = fmtTime(displayTime, col.cityObj.tz);
        const extra   = isCurrent
          ? `<span class="now-label">now</span>`
          : dayChanged
            ? `<span class="day-label">${fmtDate(hour, col.cityObj.tz)}</span>`
            : '';

        const classes = [
          dayChanged ? 'day-change' : '',
          phase !== 'night' ? `phase-${phase}` : '',
        ].filter(Boolean).join(' ');

        tbody += `
          <td class="${classes}">
            <span class="time-str">${timeStr}</span>
            ${extra}
          </td>`;
      });

      tbody += '</tr>';
    });

    wrap.innerHTML = `
      <table style="--col-count:${active.length}">
        <thead>${thead}</thead>
        <tbody>${tbody}</tbody>
      </table>`;
  }

  // ── Full render ────────────────────────────────────────────────────────────
  function render() {
    renderSelectors();
    renderTable();
  }

  // ── Event delegation ───────────────────────────────────────────────────────
  document.addEventListener('click', e => {
    const target = e.target.closest('[data-action]');

    if (!target) {
      if (!e.target.closest('.tz-slot')) closeAllDropdowns();
      return;
    }

    const { action, slotId, idx } = target.dataset;

    if (action === 'add') {
      slots.push({ id: nextId++, cityObj: null });
      render();
    }

    if (action === 'remove') {
      slots = slots.filter(s => s.id !== +slotId);
      render();
    }

    if (action === 'select-city') {
      const slot = slots.find(s => s.id === +slotId);
      if (slot) slot.cityObj = CITIES[+idx];
      closeAllDropdowns();
      render();
    }
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeAllDropdowns();
  });

  // ── Auto-refresh every minute ──────────────────────────────────────────────
  setInterval(renderTable, 60_000);

  // ── Boot ───────────────────────────────────────────────────────────────────
  render();
  </script>
</body>
</html>
